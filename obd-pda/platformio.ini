; OBD-II / CAN bus handheld on an ESP32-C3 Super Mini with a 2" ST7789 display.
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Uses the same pinned pioarduino platform (Arduino core 3.x) as esp32-recon so
; both projects build against one toolchain.

[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework       = arduino
; The Super Mini is electrically a C3 DevKitM-1 with 4 MB flash.
board           = esp32-c3-devkitm-1
board_build.flash_mode = dio
; WiFi makes the firmware ~1.1 MB, close to the default 1.25 MB app slot.
; huge_app gives a 3 MB app slot (no OTA, which we don't use).
board_build.partitions = huge_app.csv
build_unflags   = -std=gnu++11 -std=gnu++2b
; The Super Mini has no USB-UART chip: Serial is the C3's native USB CDC.
build_flags     =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Strict warnings apply to our code only, not the Espressif framework sources.
build_src_flags = -Wall -Wextra -Wshadow
lib_deps        = lovyan03/LovyanGFX@^1.2.32
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Same firmware with the 5-way switch on a resistor ladder (one ADC pin),
; which leaves GPIO0, 1 and 3 free for the optional direct-CAN transceiver.
[env:c3_supermini_ladder]
extends     = env:c3_supermini
build_flags = ${env:c3_supermini.build_flags} -DOBD_PDA_NAV_LADDER
