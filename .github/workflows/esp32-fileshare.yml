name: esp32-fileshare

on:
  push:
    branches: ["**"]
    paths: ["esp32-fileshare/**", ".github/workflows/esp32-fileshare.yml"]
  pull_request:
    paths: ["esp32-fileshare/**", ".github/workflows/esp32-fileshare.yml"]

defaults:
  run:
    working-directory: esp32-fileshare

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32-fileshare/platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware (all boards)
        run: pio run -e esp32c5 -e esp32dev
