; Passive WiFi/BLE survey scanner.
; Docs: https://docs.platformio.org/page/projectconf.html
;
; The ESP32-C5 needs Arduino core 3.3+, which the official PlatformIO platform
; does not ship. pioarduino is the community-maintained platform that does.
; Pinned to a release so builds don't change underneath us.

[platformio]
default_envs = esp32c5

[env]
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework       = arduino
build_unflags   = -std=gnu++11 -std=gnu++2b
build_flags     = -std=gnu++17
; Strict warnings apply to our code only, not the Espressif framework sources.
build_src_flags = -Wall -Wextra -Wshadow
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ESP32-C5-WROOM-1 (MCN16R8: 16 MB flash, 8 MB PSRAM) on a DevKitC-1.
; Dual-band WiFi 6 (2.4 + 5 GHz) and BLE 5. Serial and flashing go through the
; board's CH343 USB-UART bridge.
[env:esp32c5]
; The stock board definition is the 4 MB / no-PSRAM module, so override both.
board                   = esp32-c5-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
build_flags             = ${env.build_flags} -DBOARD_HAS_PSRAM -DRECON_DISPLAY=1
; 2.8" ILI9341 + XPT2046 touch display. Remove RECON_DISPLAY to build without it.
lib_deps                =
    adafruit/Adafruit ILI9341@1.6.4
    adafruit/Adafruit GFX Library@1.12.6
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
upload_speed            = 921600

; Arduino Nano ESP32 (ESP32-S3 / u-blox NORA-W106). 2.4 GHz only.
[env:nano_esp32]
board           = arduino_nano_esp32
; Native USB: flashes over DFU, serial is USB CDC.
upload_protocol = dfu
