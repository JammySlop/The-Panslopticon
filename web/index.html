<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nano ESP32 Recon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --line: #262b36;
      --text: #e6e8ec;
      --muted: #8a93a3;
      --ok: #4cc38a;
      --warn: #d9a441;
      --bad: #e5534b;
      --accent: #5b9dd9;
      --gold: #e3b341;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header, #toolbar {
      position: sticky; z-index: 3;
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line);
    }
    header { top: 0; z-index: 4; }
    #toolbar { top: 49px; }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    button {
      padding: 6px 12px; font: inherit; color: var(--text);
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 6px; cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    button.on { border-color: var(--accent); color: #cfe4f7; }
    input[type=search] {
      flex: 1; min-width: 180px; padding: 6px 10px; font: inherit;
      color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 6px;
    }
    input[type=search]:focus { outline: none; border-color: var(--accent); }
    label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.live { background: var(--ok); }
    .muted { color: var(--muted); }
    .meta { color: var(--muted); margin-left: auto; }
    main { display: grid; gap: 24px; padding: 16px 20px 40px; }
    h2 { display: flex; gap: 10px; align-items: baseline; margin: 0 0 8px; font-size: 14px; }
    h2 .count { color: var(--muted); font-weight: 400; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); }
    th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    td.wrap { white-space: pre-line; }
    td.flag { color: var(--bad); font-weight: 600; }
    td.age { color: var(--muted); }
    .none { color: var(--muted); font-style: italic; }
    tr.stale { opacity: .4; }
    tr.ignored { opacity: .3; }
    tr.pinned td { background: #1b1e1a; }
    tr.pinned td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
    td.empty { padding: 20px; text-align: center; color: var(--muted); }
    .bar { display: inline-block; width: 52px; height: 6px; margin-right: 6px; vertical-align: middle; background: var(--line); border-radius: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--ok); }
    svg.spark { vertical-align: middle; margin-right: 6px; }
    .trend { font-size: 12px; margin-left: 6px; }
    .trend.up { color: var(--ok); }
    .trend.down { color: var(--warn); }
    .ctrl { cursor: pointer; user-select: none; margin-right: 4px; }
    .pin { color: var(--muted); }
    .pin.on { color: var(--gold); }
    .toggle { color: var(--muted); }
    .alias { display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 4px; background: #1e2b1e; color: #9fe0a0; font-size: 12px; font-weight: 600; }
    .newbadge { display: inline-block; padding: 0 5px; margin-left: 6px; border-radius: 4px; background: #24303f; color: #9fc7f0; font-size: 11px; }
    tr.detail td { background: #0c0e12; color: var(--muted); white-space: normal; font-size: 13px; }
    tr.detail .panel { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; align-items: baseline; }
    tr.detail dt { color: var(--text); }
    tr.detail .row { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
    tr.detail button { padding: 3px 10px; font-size: 13px; }
    .tag { display: inline-block; padding: 1px 6px; margin: 1px; background: var(--line); border-radius: 4px; font-size: 12px; }
    #alerts { display: none; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 6px; background: #2a1515; color: #ffb3ae; }
    #alerts.show { display: block; }
    #alerts b { color: #fff; }
    .chan { display: grid; grid-template-columns: 3ch 1fr max-content; gap: 6px 10px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .chan .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .chan .track > i { display: block; height: 100%; background: var(--warn); }
    .chan .n { color: var(--muted); text-align: right; }
    .group-title { margin: 8px 0 -8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Nano ESP32 Recon</h1>
    <button id="connect" type="button">Connect</button>
    <span class="status"><span id="dot" class="dot"></span><span id="status">Not connected</span></span>
    <span id="meta" class="meta"></span>
  </header>

  <div id="toolbar">
    <input id="filter" type="search" placeholder="Filter by alias, MAC/BSSID, SSID, name, vendor, note…">
    <button id="freeze" type="button" title="Pause updates so rows stop moving">Freeze</button>
    <label class="chk"><input id="show-hidden" type="checkbox"> Show hidden <span id="hidden-count"></span></label>
    <button id="export" type="button" title="Download everything on screen as JSON">Export</button>
    <span id="filter-info" class="muted"></span>
  </div>

  <main>
    <div id="alerts"></div>

    <section>
      <h2>WiFi networks <span id="wifi-count" class="count"></span></h2>
      <div class="scroll"><table>
        <thead><tr id="wifi-head"></tr></thead>
        <tbody id="wifi-body"></tbody>
      </table></div>
    </section>

    <section>
      <h2>Bluetooth LE devices <span id="ble-count" class="count"></span></h2>
      <div class="scroll"><table>
        <thead><tr id="ble-head"></tr></thead>
        <tbody id="ble-body"></tbody>
      </table></div>
    </section>

    <p class="group-title">Monitor mode — passively overheard 802.11 traffic</p>

    <section>
      <h2>Probing clients <span id="clients-count" class="count"></span></h2>
      <div class="scroll"><table>
        <thead><tr id="clients-head"></tr></thead>
        <tbody id="clients-body"></tbody>
      </table></div>
    </section>

    <section>
      <h2>Access point traffic <span id="aps-count" class="count"></span></h2>
      <div class="scroll"><table>
        <thead><tr id="aps-head"></tr></thead>
        <tbody id="aps-body"></tbody>
      </table></div>
    </section>

    <section>
      <h2>Channel activity</h2>
      <div id="channels" class="chan"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
