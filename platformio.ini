; ============================================================================
;  Arduino Nano ESP32  (ESP32-S3 / u-blox NORA-W106, 16 MB flash, 8 MB PSRAM)
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
default_envs = nano_esp32
build_cache_dir = .pio/build_cache

; --- settings inherited by every environment --------------------------------
[env]
; Strict warnings are scoped to OUR code via build_src_flags. Putting them in
; build_flags would also apply them to the Espressif framework sources, whose
; warnings we cannot fix and which would drown out our own.
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion

; --- day-to-day development build -------------------------------------------
[env:nano_esp32]
platform         = espressif32
board            = arduino_nano_esp32
framework        = arduino
build_type       = debug
; The arduino-esp32 core still compiles at gnu++11. Raise it so `inline
; constexpr`, if constexpr, structured bindings etc. are actually legal.
build_unflags    = -std=gnu++11
build_src_flags  = ${env.build_src_flags}
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DAPP_ENV=\"dev\"
; The Nano ESP32 exposes native USB, so it flashes over DFU rather than a
; USB-serial bridge. The board manifest already sets ARDUINO_USB_CDC_ON_BOOT.
upload_protocol  = dfu
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
lib_deps =

; --- optimised build for firmware you intend to leave running ----------------
[env:nano_esp32_release]
extends          = env:nano_esp32
build_type       = release
build_src_flags  = ${env.build_src_flags}
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DAPP_ENV=\"release\"

; --- host-side unit tests (no board required) -------------------------------
; Requires a host compiler on PATH (MinGW-w64 g++ or MSVC). See README.
[env:native]
platform         = native
test_framework   = unity
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DUNIT_TEST
