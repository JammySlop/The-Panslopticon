; Arduino Nano ESP32 (ESP32-S3 / u-blox NORA-W106)
; Docs: https://docs.platformio.org/page/projectconf.html

[env:nano_esp32]
platform        = espressif32
board           = arduino_nano_esp32
framework       = arduino
; The arduino-esp32 core defaults to gnu++11; use a modern standard.
build_unflags   = -std=gnu++11
build_flags     = -std=gnu++17
; Strict warnings apply to our code only, not the Espressif framework sources.
build_src_flags = -Wall -Wextra -Wshadow
; Native USB: flashes over DFU, serial is USB CDC.
upload_protocol = dfu
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
