; Example firmware for the FileShare library (lib/FileShare): joins WiFi and
; shares a LittleFS directory over HTTP.
; Docs: https://docs.platformio.org/page/projectconf.html
;
; The ESP32-C5 needs Arduino core 3.3+, which the official PlatformIO platform
; does not ship. pioarduino is the community-maintained platform that does.
; Pinned to the same release as esp32-recon.

[platformio]
default_envs = esp32c5

[env]
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework         = arduino
build_unflags     = -std=gnu++11 -std=gnu++2b
build_flags       = -std=gnu++17
                    ${sysenv.FILESHARE_BUILD_FLAGS}
build_src_flags   = -Wall -Wextra -Wshadow
board_build.filesystem = littlefs
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, time
; Optional, seeds the WiFi credentials on first boot instead of using the
; setup hotspot. Set them in the environment, never in this file:
;   $env:FILESHARE_BUILD_FLAGS = '-DFILESHARE_SSID=\\"MyWifi\\" -DFILESHARE_PASS=\\"secret\\"'
; -DFILESHARE_USER / -DFILESHARE_PASSWORD likewise turn on HTTP basic auth.

; ESP32-C5-WROOM-1 (16 MB flash, 8 MB PSRAM) on a DevKitC-1.
[env:esp32c5]
board                   = esp32-c5-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
build_flags             = ${env.build_flags} -DBOARD_HAS_PSRAM
upload_speed            = 921600

; Plain ESP32 build, to keep the library honest about portability.
[env:esp32dev]
board = esp32dev
